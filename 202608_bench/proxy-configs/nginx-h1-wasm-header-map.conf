worker_processes 24;                                                                                                                                                                                                                   
worker_cpu_affinity 1010101010101010101010101010101010101010101010100000000000000000;
worker_rlimit_nofile 1000000;                                                                                                                                                                                                          
daemon off;
                                                                                                                                                                                                                                       
events {                                                                                                                                                                                                                               
    worker_connections 100000;                                                                                                                                                                                                         
    use epoll;                                                                                                                                                                                                                         
    multi_accept on;                                                                                                                                                                                                                   
    accept_mutex off;                                                                                                                                                                                                                  
}                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                       
wasm {
    module benchmark /path/to/arion/arion-wasm-sdk/proxy-wasm/benchmark_filter/target/wasm32-unknown-unknown/release/benchmark_filter_proxy_wasm.wasm;
    module body_mutation /path/to/arion/arion-wasm-sdk/proxy-wasm/body_mutation_filter/target/wasm32-unknown-unknown/release/body_mutation_filter_proxy_wasm.wasm;
    module callout_authz /path/to/arion/arion-wasm-sdk/proxy-wasm/callout_authz_filter/target/wasm32-unknown-unknown/release/callout_authz_filter_proxy_wasm.wasm;
    module callout_body /path/to/arion/arion-wasm-sdk/proxy-wasm/callout_body_filter/target/wasm32-unknown-unknown/release/callout_body_filter_proxy_wasm.wasm;
    module direct_response /path/to/arion/arion-wasm-sdk/proxy-wasm/direct_response_filter/target/wasm32-unknown-unknown/release/direct_response_filter_proxy_wasm.wasm;
    module header_api /path/to/arion/arion-wasm-sdk/proxy-wasm/header_api_filter/target/wasm32-unknown-unknown/release/header_api_filter_proxy_wasm.wasm;
    module headers_map /path/to/arion/arion-wasm-sdk/proxy-wasm/headers_map_filter/target/wasm32-unknown-unknown/release/headers_map_filter_proxy_wasm.wasm;
    module header_mutations /path/to/arion/arion-wasm-sdk/proxy-wasm/header_mutations_filter/target/wasm32-unknown-unknown/release/header_mutations_filter_proxy_wasm.wasm;
    module shared_atomic /path/to/arion/arion-wasm-sdk/proxy-wasm/shared_atomic/target/wasm32-unknown-unknown/release/shared_atomic_proxy_wasm.wasm;
}

http {
    #error_log /dev/stdout info;
    #access_log /dev/stdout;

    include     /etc/nginx/mime.types;
    default_type        application/octet-stream;                                                                                                                                                                                      
                                                                                                                                                                                                                                       
    output_buffers 1 2m;                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                          
    open_file_cache max=20000 inactive=1h;                                                                                                                                                                                                                                                
    open_file_cache_valid 1h;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;                                                                                                                                                                                                                                                           
    access_log off;
    sendfile   off;
    tcp_nopush  on;                                                                                                                                                                                                                                                                       
    tcp_nodelay on;  

    keepalive_timeout   1h;                                                                                                                                                                                                            
    keepalive_requests  10000000;

    upstream cluster_http {
        server 192.168.200.2:80;
        keepalive 1000000;
    }

    upstream service {
        server 192.168.200.2:81;
        keepalive 1000000;
    }

    server {
        listen 192.168.100.1:8000;

        location /direct {
            return 200 "meow";
        }

        location / {
	    #proxy_wasm benchmark '{}';
	    #proxy_wasm body_mutation '{}';
	    #proxy_wasm callout_authz '{}';
	    #proxy_wasm callout_body '{}';
            #proxy_wasm direct_response '{}';
	    #proxy_wasm header_api '{}';
	    proxy_wasm headers_map '{}';
            #proxy_wasm header_mutations '{}';
	    #proxy_wasm shared_atomic '{}';
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://cluster_http;
        }
    }
}

