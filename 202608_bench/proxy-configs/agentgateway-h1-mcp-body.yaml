# yaml-language-server: $schema=https://agentgateway.dev/schema/config

config:
  logging: 
    level: error

binds:
  - port: 8001
    listeners:
      - hostname: 192.168.100.1
        routes:
          # Match the incoming JRPC POST request from the agent
          - name: pet-store 
            matches:
              - method: POST
                path:
                  pathPrefix: "/pet/"
            backends:
              - mcp:
                  targets:
                    - name: openapi 
                      openapi:
                        schema:
                          #file: /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/openapi-schema.json
                          #file: /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/openapi-path.json
                          #file: /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/openapi-query.json
                          file: /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/openapi-body.json
                          #file: /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/openapi-path-query-body.json
                        host: 192.168.200.2:80 # Your upstream REST target

