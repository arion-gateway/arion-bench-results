worker_processes 32;
worker_cpu_affinity 1010101010101010101010101010101010101010101010101010101010101010;
worker_rlimit_nofile 1000000;
daemon off;
load_module /etc/nginx/modules/ngx_http_auth_cedar_module.so;

events {                                                                                                                                                                                                                               
    worker_connections 100000;                                                                                                                                                                                                         
    use epoll;                                                                                                                                                                                                                         
    multi_accept on;                                                                                                                                                                                                                   
    accept_mutex off;                                                                                                                                                                                                                  
}

http {
    #error_log /dev/stdout info;
    #access_log /dev/stdout;

    auth_cedar_policy_file def /etc/nginx/policies/policy.cedar;

    include     /etc/nginx/mime.types;
    default_type        application/octet-stream;                                                                                                                                                                                      
                                                                                                                                                                                                                                       
    output_buffers 1 2m;
    open_file_cache max=20000 inactive=1h;
    open_file_cache_valid 1h;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    access_log off;
    sendfile   off;
    tcp_nopush  on;
    tcp_nodelay on;  

    keepalive_timeout   1h;                                                                                                                                                                                                            
    keepalive_requests  10000000;

    upstream cluster_http {
        server 192.168.200.2:80;
        keepalive 1000000;
    }

    upstream service {
        server 192.168.200.2:81;
        keepalive 1000000;
    }

    server {
        listen 192.168.100.1:8000;

        location /direct {
            return 200 "meow";
        }

        location /health {
            auth_cedar_resource_type Health;
            auth_cedar on;
            auth_cedar_deny_status 427;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://cluster_http;
        }

	#location /error {
        #    auth_cedar on;
        #    auth_cedar_deny_status 427;
        #    proxy_http_version 1.1;
        #    proxy_set_header Connection "";
        #    proxy_pass http://cluster_http;
        #}

	location / {
            auth_cedar on;
	    #auth_cedar_deny_status 427;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://cluster_http;
        }
    }
}

