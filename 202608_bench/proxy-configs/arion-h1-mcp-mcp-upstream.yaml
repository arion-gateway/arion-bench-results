runtime:
  num_cpus: 24
  num_runtimes: 24
  affinity_strategy:
    type: auto

logging:
  log_level: "info"

envoy_bootstrap:
  admin:
    address:
      socketAddress:
        address: "127.0.0.1"
        portValue: 9901
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 192.168.100.1, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: arion.filters.http.mcp
                      typed_config:
                        "@type": type.googleapis.com/arion.extensions.filters.http.mcp.mcp_gateway.v3.McpGateway
                        server_info:
                          name: "arion-mcp-gateway"
                          version: "0.0.1"
                        tools_mode: {}
                        dynamic_mcp_servers:
                          - namespace: "everything-statico"
                            tool_disclosure_mode: EAGER
                            description: "everything-statico mcp server"
                            transport: StreamableHttp
                            path: /mcp
                            cluster: pet_store_cluster
                            cache_duration: 10s
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  generate_request_id: false
                  routeConfig:
                    name: basic_http_route
                    virtual_hosts:
                      - name: backend
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/direct"
                            direct_response:
                              status: 200
                              body:
                                inline_string: "meow" 
                          - match:
                              prefix: "/"
                            route:
                              cluster: pet_store_cluster 
 
    clusters:
      - name: pet_store_cluster 
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN      
        original_dst_lb_config:
          use_http_header: true
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 192.168.200.2
                        port_value: 80
