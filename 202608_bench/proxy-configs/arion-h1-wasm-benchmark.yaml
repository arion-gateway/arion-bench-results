runtime:
  num_cpus: 32
  num_runtimes: 32
  num_service_threads: 8
  affinity_strategy:
    type: auto

logging:
  log_level: "info"

envoy_bootstrap:
  admin:
    address:
      socketAddress:
        address: "192.168.100.1"
        portValue: 9901
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 192.168.100.1, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: arion.filters.http.wasm
                      typed_config:
                         "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                         config:
                           name: "my_plugin"
                           root_id: "my_root_id"
                           # if your wasm filter requires custom configuration you can add
                           # as follows
                           configuration:
                             "@type": "type.googleapis.com/google.protobuf.StringValue"
                             value: |
                               {}
                           vm_config:
                             vm_id: "my_vm_id"
                             code:
                               local:
                                 filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/benchmark_filter.wasm" 
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/body_mutation_filter.wasm"
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/callout_authz_filter.wasm"
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/callout_body_filter.wasm"
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/direct_response_filter.wasm"
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/header_api_filter.wasm" 
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/header_mutations_filter.wasm" 
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/headers_map_filter.wasm" 
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/shared_atomic.wasm" 
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/shared_blob.wasm"
                                 #filename: "/path/to/arion/arion-wasm-sdk/target/wasm32-unknown-unknown/release/metadata_filter.wasm"
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  generate_request_id: false
                  routeConfig:
                    name: basic_http_route
                    virtual_hosts:
                      - name: backend
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/direct"
                            direct_response:
                              status: 200
                              body:
                                inline_string: "meow" 
                          - match:
                              prefix: "/"
                            route:
                              cluster: cluster_http
 
    clusters:

      - name: cluster_http
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN      
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 192.168.200.2
                        port_value: 80

      - name: service
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN      
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 192.168.200.2
                        port_value: 81
