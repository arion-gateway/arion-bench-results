worker_processes 4;
worker_cpu_affinity 0000000000000000000000000000000000000000000000000000000010101010;
worker_rlimit_nofile 1000000;
daemon off;
 
events {
    worker_connections 100000;
    use epoll;
    multi_accept on;
    accept_mutex off;
}
http {
    #error_log /dev/stdout info;
    #access_log /dev/stdout;
    include     /etc/nginx/mime.types;
    default_type        application/octet-stream;
 
    output_buffers 1 2m;
    open_file_cache max=20000 inactive=1h;
    open_file_cache_valid 1h;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    access_log off;
    sendfile   off;
    #tcp_nopush  on;
    #tcp_nodelay on;
    keepalive_timeout   1h;
    keepalive_requests  10000000;
 
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:200m;
    ssl_session_timeout 1h;
    #ssl_session_tickets on;
    #ssl_buffer_size     16k;
 
    upstream cluster_http {
        server 192.168.200.2:80;
        keepalive           1000000;
        # Very important to keep keepalive_requests also upstream
        # otherwise we loose a lot of throughput
    	keepalive_requests  10000000;
    }
    server {
	#listen 192.168.200.2:80 reuseport;
	listen 192.168.100.1:8000 reuseport;
        location /direct {
		#return 200 "meow";
            return 200;
        }
	location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://cluster_http;
        }
    }
    server {
        listen 192.168.100.1:8443 ssl reuseport;
        #listen 192.168.100.1:8443 ssl;
        # envoy's filter_chain_match is on SNI cnpp1.example; keep this server
        # as the default one too so non-SNI / other-SNI clients still land here.
        server_name cnpp1.example *.cnpp1.example;
 
        ssl_certificate     /etc/nginx/certs/cnpp1.crt;
        ssl_certificate_key /etc/nginx/certs/cnpp1.key;
 
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://cluster_http;
        }
    }
}

