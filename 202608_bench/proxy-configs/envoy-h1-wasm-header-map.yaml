admin:
  address:
    socket_address:
      address: 192.168.100.1
      port_value: 9901

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 192.168.100.1
          port_value: 8000
      filter_chains:
        - name: filter_chain_http
          filter_chain_match:
            destination_port: 8000
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: "my_plugin"
                        root_id: "my_root_id"
                        configuration:
                          "@type": "type.googleapis.com/google.protobuf.StringValue"
                          value: |
                            {}
                        vm_config:
                          vm_id: "my_vm_id"
                          runtime: "envoy.wasm.runtime.v8"
                          code:
                            local:
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/benchmark_filter/target/wasm32-unknown-unknown/release/benchmark_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/body_mutation_filter/target/wasm32-unknown-unknown/release/body_mutation_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/callout_authz_filter/target/wasm32-unknown-unknown/release/callout_authz_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/callout_body_filter/target/wasm32-unknown-unknown/release/callout_body_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/direct_response_filter/target/wasm32-unknown-unknown/release/direct_response_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/header_api_filter/target/wasm32-unknown-unknown/release/header_api_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/header_mutations_filter/target/wasm32-unknown-unknown/release/header_mutations_filter_proxy_wasm.wasm"
                              filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/headers_map_filter/target/wasm32-unknown-unknown/release/headers_map_filter_proxy_wasm.wasm"
                              #filename: "/path/to/arion/arion-wasm-sdk/proxy-wasm/shared_atomic/target/wasm32-unknown-unknown/release/shared_atomic_proxy_wasm.wasm"

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      start_child_span: false
                route_config:
                  name: basic_http_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/direct"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "meow"
                        - match:
                            prefix: "/"
                          route:
                            cluster: cluster_http

  clusters:
    - name: cluster_http
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: cluster_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.200.2
                      port_value: 80

    - name: service
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.200.2
                      port_value: 81

