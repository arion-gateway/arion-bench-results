runtime:
  num_cpus: 32
  num_runtimes: 32
  num_service_threads: 8
  affinity_strategy:
    type: auto

logging:
  log_level: "info"
  #log_level: "debug"

envoy_bootstrap:
  admin:
    address:
      socketAddress:
        address: "192.168.100.1"
        portValue: 9901
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 192.168.100.1, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: arion.filters.http.cedar
                      typed_config:
                        "@type": type.googleapis.com/arion.extensions.filters.http.cedar.cedar_policy.v3.CedarPolicy
                        schema: |
                          entity User;
                          entity HttpPath;

                          action "GET" appliesTo {
                            principal: [User],
                            resource:  [HttpPath],
                            context: {
                              http: {
                                method: String,
                                path:   String,
                                query?: String,
                              }
                            }
                          };

                          action "POST" appliesTo {
                            principal: [User],
                            resource:  [HttpPath],
                            context: {
                              http: {
                                method: String,
                                path:   String,
                                query?: String,
                              }
                            }
                          };
                        policies: |
                          permit (
                            principal,
                            action    == Action::"GET",
                            resource  == HttpPath::"/health"
                          );
                        #policies: |
                        #  permit (
                        #    principal == User::"anonymous",
                        #    action    == Action::"GET",
                        #    resource  == HttpPath::"/health"
                        #  );
                        enforcement_mode: ENFORCE
                        failure_mode: FAIL_CLOSED
                        validate_schema_per_request: false
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  generate_request_id: false
                  routeConfig:
                    name: basic_http_route
                    virtual_hosts:
                      - name: backend
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/direct"
                            direct_response:
                              status: 200
                              body:
                                inline_string: "meow" 
                          - match:
                              prefix: "/"
                            route:
                              cluster: cluster_http
 
    clusters:

      - name: cluster_http
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN      
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 192.168.200.2
                        port_value: 80
