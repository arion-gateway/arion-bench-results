  listeners:
    - name: listener_http
      address:
        socket_address: { address: 192.168.100.1, port_value: 8000 }
      filterChains:
        - name: filter_chain_http
          filter_chain_match:
            destination_port: 8000
          filters:
            - name: http_gateway
              typedConfig:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                statPrefix: ingress_http
                codecType: HTTP1
                httpFilters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      observability_mode: false
                      failure_mode_allow: false
                      send_body_without_waiting_for_header_response: false
                      processing_mode:
                        request_header_mode: "SEND"
                        request_body_mode: "NONE"
                        request_trailer_mode: "SKIP"
                        response_header_mode: "SKIP"
                        response_body_mode: "NONE"
                        response_trailer_mode: "SKIP"
                      grpc_service:
                        envoy_grpc:
                          cluster_name: ext-proc-server
                  - name: envoy.filters.http.router
                    typedConfig:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      start_child_span: false
                generate_request_id: false
                routeConfig:
                  name: basic_http_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/direct"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "meow" 
                        - match:
                            prefix: "/"
                          route:
                            cluster: cluster_http

  clusters:
    - name: cluster_http
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN      
      load_assignment:
        cluster_name: cluster_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.200.2
                      port_value: 80

    - name: ext-proc-server
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ext-proc-server
        endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 10.0.0.2
                    port_value: 18080

