# Internal listener chain:
#
#   client --tcp:8000--> listener_ingress (HCM/HTTP1)
#                          |
#                          +--> cluster_internal_listener  (endpoint: envoy_internal_address)
#                                 |
#                                 +--> listener_internal (internal listener, HCM/HTTP1)
#                                        |
#                                        +--> cluster_http_backend (plain HTTP1 upstreams)
#
# NOTE: stock Envoy additionally requires the internal listener bootstrap extension:
#
#   bootstrap_extensions:
#     - name: envoy.bootstrap.internal_listener
#       typed_config:
#         "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener
#
# Arion does not need it and rejects `bootstrap_extensions`, so it is left commented out here.

runtime:
  num_cpus: 24
  num_runtimes: 24
  event_interval: 31            # estimated optimal value
  global_queue_interval: null   # default
  max_io_events_per_tick: null  # default

logging:
  log_level: "info"
#  log_directory: "."
#  log_file: "arion.log"

envoy_bootstrap:
  static_resources:
    listeners:
      # ---------------------------------------------------------------- #
      # Front listener: terminates the real TCP connection and routes     #
      # everything into the internal-listener cluster.                    #
      # ---------------------------------------------------------------- #
      - name: listener_ingress
        address:
          socket_address: { address: 0.0.0.0, port_value: 8000 }
        filterChains:
          - name: filter_chain_ingress
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  routeConfig:
                    name: ingress_route
                    virtual_hosts:
                      - name: ingress
                        domains: ["*"]
                        routes:
                          # Answers without leaving this listener: proves the
                          # front hop is up before testing the internal one.
                          - match:
                              prefix: "/ingress-direct-response"
                            direct_response:
                              status: 200
                              body:
                                inline_string: "hop 1: listener_ingress 🐱"
                          # Everything else goes through the internal listener.
                          - match:
                              prefix: "/"
                            route:
                              cluster: cluster_internal_listener
                              #cluster: cluster_http_backend

      # ---------------------------------------------------------------- #
      # Internal listener: no address, reachable only through a cluster   #
      # with an envoy_internal_address endpoint. Note there is no         #
      # filter_chain_match: internal connections carry no real            #
      # destination port, so a destination_port match would never hit.    #
      # ---------------------------------------------------------------- #
      - name: listener_internal
        internal_listener: {}
        filterChains:
          - name: filter_chain_internal
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: internal_http
                  codecType: HTTP1
                  httpFilters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  routeConfig:
                    name: internal_route
                    virtual_hosts:
                      - name: internal
                        domains: ["*"]
                        routes:
                          # Confirms the internal hop was reached without
                          # needing a live upstream behind it.
                          - match:
                              prefix: "/internal-direct-response"
                            direct_response:
                              status: 200
                              body:
                                inline_string: "hop 2: listener_internal 🐱"
                          - match:
                              prefix: "/"
                            route:
                              cluster: cluster_http_backend

    clusters:
      # The internal-listener cluster: its endpoint is a user-space address
      # naming listener_internal instead of an ip:port.
      - name: cluster_internal_listener
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: cluster_internal_listener
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      envoy_internal_address:
                        server_listener_name: listener_internal

      # Plain HTTP1 upstreams, e.g. two `python3 -m http.server` instances.
      - name: cluster_http_backend
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: cluster_http_backend
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 192.168.200.2
                        port_value: 80 

