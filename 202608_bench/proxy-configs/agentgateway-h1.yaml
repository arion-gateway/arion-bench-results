# yaml-language-server: $schema=https://agentgateway.dev/schema/config

config:
  logging:
    level: error

binds:
  - port: 8000
    listeners:
      - hostname: 192.168.100.1
        routes:
          # Catch everything and forward straight to the upstream backend
          - name: backend
            matches:
              - path:
                  pathPrefix: "/"
            backends:
              - host: 192.168.200.2:80 # Your upstream REST target

  # TLS+HTTP/1.1 downstream, same plaintext HTTP/1.1 upstream as above
  - port: 8443
    listeners:
      - hostname: cnpp1.example
        protocol: HTTPS
        tls:
          cert: /etc/nginx/certs/cnpp1.crt
          key: /etc/nginx/certs/cnpp1.key
        routes:
          - name: backend
            matches:
              - path:
                  pathPrefix: "/"
            backends:
              - host: 192.168.200.2:80 # Your upstream REST target
