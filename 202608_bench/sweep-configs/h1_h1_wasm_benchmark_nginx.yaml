# Converted from local_perf_sweep_nginx_h1_h1_wasm_benchmark.py
name: h1_h1_wasm_benchmark_nginx

vars:
  duration: 30
  backend_host: '192.168.200.2'
  backend_port: 80
  proxy_host: '192.168.100.1'
  proxy_port: 8000
  nofile: 1000000
  statico: '/home/francesco/.cargo/bin/statico'
  plumbrs: '/home/francesco/.cargo/bin/plumbrs'
  backend_cores: '32-62:2'
  proxy_cores: '1-63:2'
  gen_cores: '0-30:2'

sweep:
  rpc: [4294967295]
  concurrency: [1024, 512, 256]

settings:
  repeat: 1
  ready_timeout: 5

services:
  - name: backend
    command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${backend_cores} ${statico} --ports ${backend_port} --threads 16 --runtime compio"'
    ready: ${backend_host}:${backend_port}
  - name: proxy
    command: 'sudo -n ip netns exec proxy bash -c "ulimit -n ${nofile}; exec taskset -c ${proxy_cores} /path/to/nginx-wasmx-prerelease-0.6.0-wasmtime-x86_64-centos8/nginx -c /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/nginx-h1-wasm-benchmark.conf"'
    ready: ${proxy_host}:${proxy_port}

generator:
  command: "sudo -n bash -c 'ulimit -n ${nofile}; exec taskset -c ${gen_cores} ${plumbrs} --threads 16 --duration ${duration} --concurrency ${concurrency} --rpc ${rpc}  -H \"Authorization: \" --latency --stats-csv-header http://${proxy_host}:${proxy_port}/'"
