# New: mcp-forwarding family. Plain L7 forwarding, no MCP gateway filter --
# proxy-configs/haproxy-h1.cfg is the unmodified baseline config. Client and
# backend speak MCP; the proxy just forwards bytes. Backend/generator
# commands borrowed from h1_h1_mcp_gateway_mcp_upstream_arion.yaml.
name: h1_h1_mcp_forwarding_haproxy

vars:
  duration: 30
  backend_host: '192.168.200.2'
  backend_port: 80
  proxy_host: '192.168.100.1'
  proxy_port: 8000
  nofile: 1000000
  statico: '/home/francesco/.cargo/bin/statico'
  plumbrs: '/home/francesco/.cargo/bin/plumbrs'
  backend_cores: '40-62:2'
  proxy_cores: '17-63:2'
  gen_cores: '0-62:2'

sweep:
  rpc: [4294967295]
  concurrency: [1024, 512, 256]

settings:
  repeat: 1
  ready_timeout: 5

services:
  - name: backend
    command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${backend_cores} ${statico} --ports ${backend_port} --threads 12 --mcp-everything"'
    ready: ${backend_host}:${backend_port}
  - name: proxy
    command: 'sudo -n ip netns exec proxy bash -c "ulimit -n ${nofile}; exec taskset -c ${proxy_cores} /usr/sbin/haproxy -f /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/haproxy-h1.cfg"'
    ready: ${proxy_host}:${proxy_port}

generator:
  command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${gen_cores} ${plumbrs} --threads 32 --duration ${duration} --concurrency ${concurrency} --mcp --latency --stats-csv-header http://${proxy_host}:${proxy_port}/mcp"'
