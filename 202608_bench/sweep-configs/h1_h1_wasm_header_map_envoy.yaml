# Converted from local_perf_sweep_envoy_h1_h1_wasm_header_map.py
# --client compio dropped: wins only at rpc=unlimited, loses at low rpc.
# reviewed: gen_cores 16-38:2 -> 0-62:2 (generator must not be the bottleneck without compio)
name: h1_h1_wasm_header_map_envoy

vars:
  duration: 30
  backend_host: '192.168.200.2'
  backend_port: 80
  proxy_host: '192.168.100.1'
  proxy_port: 8000
  nofile: 1000000
  statico: '/home/francesco/.cargo/bin/statico'
  plumbrs: '/home/francesco/.cargo/bin/plumbrs'
  backend_cores: '40-62:2'
  proxy_cores: '17-63:2'
  gen_cores: '0-62:2'

sweep:
  rpc: [4294967295]
  concurrency: [1024, 512, 256]

settings:
  repeat: 1
  ready_timeout: 5

services:
  - name: backend
    command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${backend_cores} ${statico} --ports ${backend_port} --threads 12 --runtime compio"'
    ready: ${backend_host}:${backend_port}
  - name: proxy
    command: 'sudo -n ip netns exec proxy bash -c "ulimit -n ${nofile}; exec taskset -c ${proxy_cores} /home/francesco/envoy-1.37.1-linux-x86_64 -c /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/envoy-h1-wasm-header-map.yaml"'
    ready: ${proxy_host}:${proxy_port}

generator:
  command: "sudo -n bash -c 'ulimit -n ${nofile}; exec taskset -c ${gen_cores} ${plumbrs} --threads 32 --duration ${duration} --concurrency ${concurrency} -H \"header1: \" --latency --stats-csv-header http://${proxy_host}:${proxy_port}/'"
