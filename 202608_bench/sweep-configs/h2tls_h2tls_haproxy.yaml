# Converted from local_perf_sweep_haproxy_h2tls_h2tls.py
# reviewed: gen_cores 16-38:2 -> 0-62:2 (generator must not be the bottleneck without compio)
name: h2tls_h2tls_haproxy

vars:
  duration: 30
  backend_host: '192.168.200.2'
  backend_port: 443
  proxy_host: 'cnpp1.example'
  proxy_port: 8443
  nofile: 1000000
  statico: '/home/francesco/.cargo/bin/statico'
  plumbrs: '/home/francesco/.cargo/bin/plumbrs'
  backend_cores: '40-62:2'
  proxy_cores: '17-63:2'
  gen_cores: '0-62:2'

sweep:
  rpc: [4294967295, 100, 10, 1]
  concurrency: [2048, 1024, 512, 256]

settings:
  repeat: 1
  ready_timeout: 5

services:
  - name: backend
    command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${backend_cores} ${statico} --ports ${backend_port} --threads 12 --cert /etc/nginx/certs/cnpp1.crt --key /etc/nginx/certs/cnpp1.key --http2"'
    ready: ${backend_host}:${backend_port}
  - name: proxy
    command: 'sudo -n ip netns exec proxy bash -c "ulimit -n ${nofile}; exec taskset -c ${proxy_cores} /usr/sbin/haproxy -f /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/haproxy-h2.cfg"'
    ready: ${proxy_host}:${proxy_port}

generator:
  command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${gen_cores} ${plumbrs} --threads 32 --duration ${duration} --concurrency ${concurrency} --rpc ${rpc} --insecure --http2 --latency --stats-csv-header https://${proxy_host}:${proxy_port}/h2"'
