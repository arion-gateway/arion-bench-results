# Converted from local_perf_sweep_arion_h1_h1_small_scale.py
name: h1_h1_small_scale_arion

vars:
  duration: 30
  backend_host: '192.168.200.2'
  backend_port: 80
  proxy_host: '192.168.100.1'
  proxy_port: 8000
  nofile: 1000000
  statico: '/home/francesco/.cargo/bin/statico'
  plumbrs: '/home/francesco/.cargo/bin/plumbrs'
  backend_cores: '40-62:2'
  proxy_cores: '1-7:2'
  gen_cores: '16-38:2'

sweep:
  rpc: [4294967295, 1]
  concurrency: [256, 128, 64, 32, 16, 8]

settings:
  repeat: 1
  ready_timeout: 5

services:
  - name: backend
    command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${backend_cores} ${statico} --ports ${backend_port} --threads 12 --runtime compio"'
    ready: ${backend_host}:${backend_port}
  - name: proxy
    command: 'sudo -n ip netns exec proxy bash -c "ulimit -n ${nofile}; exec taskset -c ${proxy_cores} /home/francesco/code/arion/target/release-max/arion -c /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/arion-h1-small-scale.yaml"'
    ready: ${proxy_host}:${proxy_port}

generator:
  command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${gen_cores} ${plumbrs} --threads 12 --duration ${duration} --concurrency ${concurrency} --rpc ${rpc} --latency --stats-csv-header http://${proxy_host}:${proxy_port}/"'
