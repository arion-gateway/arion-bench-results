# Converted from local_perf_sweep_nginx_h2tls_h1.py
name: h2tls_h1_nginx

vars:
  duration: 30
  backend_host: '192.168.200.2'
  backend_port: 80
  proxy_host: 'cnpp1.example'
  proxy_port: 8443
  nofile: 1000000
  statico: '/home/francesco/.cargo/bin/statico'
  plumbrs: '/home/francesco/.cargo/bin/plumbrs'
  backend_cores: '32-62:2'
  proxy_cores: '1-63:2'
  gen_cores: '0-30:2'

sweep:
  rpc: [4294967295, 100, 10, 1]
  concurrency: [2048, 1024, 512, 256]

settings:
  repeat: 1
  ready_timeout: 5

services:
  - name: backend
    command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${backend_cores} ${statico} --ports ${backend_port} --threads 16 --runtime compio"'
    ready: ${backend_host}:${backend_port}
  - name: proxy
    command: 'sudo -n ip netns exec proxy bash -c "ulimit -n ${nofile}; exec taskset -c ${proxy_cores} /home/francesco/code/nginx-1.31.4/objs/nginx -c /home/francesco/code/arion-bench-results/202608_bench/proxy-configs/nginx-h2.conf"'
    ready: ${proxy_host}:${proxy_port}

generator:
  command: 'sudo -n bash -c "ulimit -n ${nofile}; exec taskset -c ${gen_cores} ${plumbrs} --threads 16 --duration ${duration} --concurrency ${concurrency} --rpc ${rpc} --insecure --http2 --latency --stats-csv-header https://${proxy_host}:${proxy_port}/h1"'
